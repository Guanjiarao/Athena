spring:
  application:
    name: athena-relation  # 应用名（与 Nacos Data ID 前缀一致）
  profiles:
    active: dev  # 明确激活 dev 环境（可选）
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848  # Nacos 服务器地址
        file-extension: yaml          # 配置格式
        group: DEFAULT_GROUP
        # 去掉 grpc-port，让客户端自动选择
        # 如果 Nacos 2.x 且未开鉴权，不需要显式配置 grpc 端口
      discovery:
        server-addr: 127.0.0.1:8848  # 服务发现地址
        # 如果 Nacos 没开鉴权，不要配置 username/password