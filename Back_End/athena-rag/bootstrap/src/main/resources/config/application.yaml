server:
  port: 9090
  servlet:
    context-path: /api/ragent

spring:
  application:
    name: athena-rag
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: false
  setting:
    language: zh_cn
  production: false
  cors: true
  basic:
    enable: false
    username: admin
    password: 123456

