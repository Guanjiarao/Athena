spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: athena-cognition
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:d3fcf00a-f83d-4710-8a2e-2dda647187c8}
        file-extension: yaml
        shared-configs:
          - data-id: base.yaml
            refresh: true
          - data-id: database.yaml
            refresh: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:d3fcf00a-f83d-4710-8a2e-2dda647187c8}
